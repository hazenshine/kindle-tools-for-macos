<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* A single light cream theme. Every color is a token, so a dark theme
     can be added later in one place. */
  :root {
    color-scheme: light;
    --bg: #f5eee3;
    --panel: #f5eee3;
    --panel-edge: transparent;
    --panel-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    --text-main: #241d12;
    --text-muted: #4e4436;
    --ink: #1c304e;
    --ink-wash: rgba(28, 48, 78, 0.14);
    --accent: #d95a1a;
    --danger: #9c3628;
    --overlay: rgba(45, 33, 18, 0.45);
    --thumb-bg: #ffffff;
    --font-body: "Quicksand", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --font-heading: "Baloo 2", var(--font-body);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 20px 32px;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text-main);
  }

  .panel {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 15px;
    padding: 40px 36px;
    box-shadow: var(--panel-shadow);
  }

  h1, h2 {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  h1 { font-size: 26px; margin: 0 0 32px; }

  /* Tool options: panel fill, --ink border and a soft focus ring; on hover
     they get the --ink-wash fill. */
  .tools { display: grid; gap: 14px; }
  .tool {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 18px 20px;
    text-align: left;
    font: inherit;
    color: var(--text-main);
    background: var(--panel);
    border: 1px solid var(--ink);
    border-radius: 6px;
    cursor: pointer;
    outline: 2px solid transparent;
    outline-offset: 0;
    transition: background 0.15s, outline-color 0.2s ease, outline-offset 0.2s ease, transform 0.1s ease;
  }
  .tool:hover { background: var(--ink-wash); }
  .tool:active { transform: scale(0.99); }
  .tool:focus-visible { outline-color: var(--ink); outline-offset: 2px; }
  .tool:disabled { opacity: 0.55; cursor: progress; }
  .tool svg { flex: none; width: 34px; height: 34px; color: var(--ink); }
  .tool b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); }
  .tool span { display: block; font-size: 14px; color: var(--text-muted); margin-top: 2px; }

  .msg {
    display: none;
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1.5;
    border: 1px solid var(--ink);
  }
  .msg.show { display: block; }
  .msg.err { border-color: var(--danger); color: var(--danger); }
  .msg.info { color: var(--text-muted); border-color: var(--ink-wash); }
  .msg code { font-family: var(--font-mono); font-size: 13px; word-break: break-all; }
  .msg .btn { margin-top: 12px; }

  /* ALL BUTTONS SHARE ONE STYLE: filled --ink, hollow on
     hover; the 2px border stays in both states so the button doesn't jump. */
  .btn {
    background: var(--ink);
    color: var(--bg);
    padding: 9px 18px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    font-family: inherit;
    border: 2px solid var(--ink);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s, transform 0.1s ease;
  }
  .btn:hover { background: var(--bg); color: var(--ink); }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; background: var(--ink); color: var(--bg); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Gallery: a blurred backdrop with a panel that covers the screen
     (print-preview layout). */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    padding: 24px;
    background: var(--overlay);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
  }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .sheet .panel {
    max-width: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.98);
    transition: transform 160ms ease;
  }
  .sheet.open .panel { transform: none; }

  .bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--ink-wash);
  }
  .bar h2 { font-size: 22px; margin: 0; }
  .bar .count { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); letter-spacing: 0.04em; }
  .bar .actions { display: flex; gap: 10px; margin-left: auto; }

  .grid {
    flex: 1;
    overflow: auto;
    padding: 24px 28px 32px;
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    align-content: start;
  }
  /* A card is two separate buttons: the whole card selects (.pick), the
     small magnifier in the top-left corner previews (.peek). Being separate,
     opening a preview never changes the selection. */
  .card { position: relative; }
  .pick { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .pick .img {
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 6px;
    background: var(--thumb-bg);
    border: 1px solid var(--ink);
    outline: 3px solid transparent;
    outline-offset: 2px;
    transition: outline-color 0.15s ease;
  }
  .pick img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pick .lbl { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .pick .tick {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--panel); border: 2px solid var(--ink);
    transition: background 0.15s, border-color 0.15s;
  }
  .pick .tick svg { width: 14px; height: 14px; color: var(--bg); opacity: 0; }
  .pick:hover .img { outline-color: var(--ink-wash); }
  .pick:focus-visible { outline: none; }
  .pick:focus-visible .img { outline-color: var(--ink); }
  /* Selection uses the warm accent color. */
  .pick[aria-pressed="true"] .img { outline-color: var(--accent); }
  .pick[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); }
  .pick[aria-pressed="true"] .tick svg { opacity: 1; }

  .peek {
    position: absolute; top: 8px; left: 8px;
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    background: var(--ink); color: var(--bg);
    border: 2px solid var(--ink); border-radius: 6px;
    cursor: zoom-in;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .peek svg { width: 16px; height: 16px; }
  .card:hover .peek, .peek:focus-visible { opacity: 1; }
  .peek:hover { background: var(--bg); color: var(--ink); }
  .peek:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* Touch screens have no hover: keep the button visible. */
  @media (hover: none) { .peek { opacity: 1; } }

  /* Large preview: a second layer above the gallery. */
  .viewer {
    position: fixed; inset: 0; z-index: 1100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
    background: var(--overlay);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease;
  }
  .viewer.open { opacity: 1; pointer-events: auto; }
  /* A fixed 3:4 box (the Kindle screen), as big as the window allows. */
  .viewer img {
    display: block;
    width: min(100%, calc((100vh - 140px) * 3 / 4));
    height: auto;
    aspect-ratio: 3 / 4;
    object-fit: contain;
    background: var(--thumb-bg);
    border: 1px solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--panel-shadow);
    transition: opacity 120ms ease;
  }
  /* The old image fades until the new one loads, so it can't be mistaken
     for the one named in the label. */
  .viewer img.loading { opacity: 0.25; }
  .viewer .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 10px 14px; border-radius: 10px;
    background: var(--panel); box-shadow: var(--panel-shadow);
  }
  .viewer .vlabel { font-size: 14px; font-weight: 600; color: var(--text-muted); padding: 0 6px; }
  .viewer .btn.arrow { width: 44px; padding-left: 0; padding-right: 0; }
  .viewer #vpick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .viewer #vpick[aria-pressed="true"]:hover { background: var(--bg); color: var(--accent); }

  /* Delete confirmation: a small alert dialog. */
  .modal {
    position: fixed; inset: 0; z-index: 1200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: var(--overlay);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    width: 100%; max-width: 360px;
    padding: 26px 28px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--ink);
    border-radius: 10px;
    transform: scale(0.94);
    transition: transform 160ms ease;
  }
  .modal.open .modal-box { transform: none; }
  .modal-box h3 { font-family: var(--font-heading); font-weight: 600; font-size: 20px; color: var(--ink); margin: 0 0 10px; }
  .modal-box p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: var(--text-main); }
  .modal-box .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-box .row .btn { flex: 1; }
  .modal-box [hidden] { display: none; }

  .state { grid-column: 1 / -1; padding: 80px 16px; text-align: center; color: var(--text-muted); }

  @media (max-width: 600px) {
    body { padding-top: 20px; }
    .panel { padding: 32px 22px; }
    .sheet { padding: 0; }
    .sheet .panel { border-radius: 0; }
    .bar, .grid { padding-left: 16px; padding-right: 16px; }
    .bar .actions { width: 100%; }
    .bar .actions .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main class="panel">
  <h1>Kindle Tools</h1>
  <div class="tools">
    <button class="tool" id="pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 17h6" stroke-dasharray="2 2"/></svg>
      <div><b>PDF Cutter</b><span>Trims the page-number strip off notebook PDFs</span></div>
    </button>
    <button class="tool" id="gallery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>
      <div><b>Gallery</b><span>Pick and download screenshots</span></div>
    </button>
  </div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="gtitle" aria-hidden="true">
  <div class="panel">
    <div class="bar">
      <h2 id="gtitle">Screenshots</h2>
      <span class="count" id="count"></span>
      <div class="actions">
        <button class="btn" id="all">Select all</button>
        <button class="btn" id="dl" disabled>Download</button>
        <button class="btn" id="del" disabled>Delete</button>
        <button class="btn" id="close">Close</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Preview" aria-hidden="true">
  <img id="vimg" alt="">
  <div class="controls">
    <button class="btn arrow" id="vprev" aria-label="Previous">&#8249;</button>
    <span class="vlabel" id="vlabel"></span>
    <button class="btn arrow" id="vnext" aria-label="Next">&#8250;</button>
    <button class="btn" id="vpick" aria-pressed="false">Select</button>
    <button class="btn" id="vclose">Close</button>
  </div>
</div>

<div class="modal" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="ctitle" aria-describedby="ctext" aria-hidden="true">
  <div class="modal-box">
    <h3 id="ctitle">Delete from Kindle?</h3>
    <p id="ctext"></p>
    <div class="row">
      <button class="btn" id="cno">Cancel</button>
      <button class="btn" id="cyes">Delete</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const msg = $("msg"), grid = $("grid"), sheet = $("sheet");
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ZOOM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>';
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
let shots = [], selected = new Set(), live = false, vi = -1;

function say(kind, html) { msg.className = "msg show " + kind; msg.innerHTML = html; }
function hush() { msg.className = "msg"; msg.innerHTML = ""; }

// Keep the server alive while the page is open
setInterval(() => fetch("/api/ping").catch(() => {}), 60000);

const OFFLINE = "Can't reach the server. Type <code>kindle</code> in the terminal again.";

// ---- PDF Cutter: the cleaned copy is saved next to the original.
$("pdf").onclick = async () => {
  const b = $("pdf"); b.disabled = true;
  say("info", "A file picker has opened…");
  try {
    const d = await (await fetch("/api/pdf-cutter", { method: "POST" })).json();
    if (d.cancelled) hush();
    else if (d.error === "not_notebook") say("err", `<b>This file is not a Kindle notebook PDF.</b><br><code>${esc(d.file)}</code>`);
    else if (d.error === "nothing_to_clean") say("err", `Nothing to clean in this PDF; it may already be cleaned.<br><code>${esc(d.file)}</code>`);
    else if (d.error === "save_failed") say("err", `<b>Couldn't save the file.</b> Check that this folder is writable:<br><code>${esc(d.folder)}</code>`);
    else say("ok", `<b>Saved:</b> <code>${esc(d.saved)}</code><br><code>${esc(d.folder)}</code>`);
  } catch { say("err", OFFLINE); }
  b.disabled = false;
};

const ERRORS = {
  not_connected: "The Kindle isn't connected. Plug it in over USB, wait until it shows it's connected to a computer, then try again.",
  busy: "Couldn't connect to the Kindle. If Calibre or another MTP app is open, close it, replug the cable and try again.",
  open_failed: "The Kindle refused the connection. Replug the cable, wait a few seconds and try again.",
  detect_failed: "Something went wrong while detecting the Kindle. Replug the cable and try again.",
  download_failed: "A screenshot couldn't be downloaded. Try again.",
  libmtp_missing: "libmtp isn't installed. Run <code>brew install libmtp</code> in the terminal, then try again.",
};

// ---- Gallery
const shotUrl = s => "/shot/" + encodeURIComponent(s.name);

$("gallery").onclick = async () => {
  const b = $("gallery"); b.disabled = true;
  say("info", "Getting screenshots from the Kindle…");
  try {
    const d = await (await fetch("/api/gallery")).json();
    if (d.error) {
      // Without the Kindle, the screenshots fetched last time can still be opened.
      let html = ERRORS[d.error] || "Something went wrong.";
      if (d.cached && d.cached.length)
        html += `<br><button class="btn" id="cached">Open the ${plural(d.cached.length, "screenshot")} fetched earlier</button>`;
      say("err", html);
      const c = $("cached");
      if (c) c.onclick = () => { hush(); openSheet(d.cached, false); };
    } else {
      hush();
      openSheet(d.shots, true);
    }
  } catch { say("err", OFFLINE); }
  b.disabled = false;
};

function openSheet(list, fresh) {
  selected.clear(); live = fresh;
  $("gtitle").textContent = fresh ? "Screenshots" : "Screenshots (fetched earlier)";
  render(list);
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  $("close").focus();
}

function card(s, i) {
  return `
    <div class="card" data-i="${i}">
      <button class="pick" aria-pressed="${selected.has(s.name)}" aria-label="${esc(s.label)}">
        <div class="img"><img loading="lazy" src="/thumb/${encodeURIComponent(s.name)}" alt=""></div>
        <span class="tick" aria-hidden="true">${CHECK}</span>
        <span class="lbl">${esc(s.label)}</span>
      </button>
      <button class="peek" title="Preview" aria-label="Preview: ${esc(s.label)}">${ZOOM}</button>
    </div>`;
}

function render(list) {
  shots = list;
  grid.innerHTML = shots.length
    ? shots.map(card).join("")
    : `<div class="state">No screenshots on the Kindle.</div>`;
  update();
}

function closeSheet() {
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  $("gallery").focus();
}

function update() {
  $("count").textContent = shots.length ? `${selected.size}/${shots.length} selected` : "";
  $("dl").disabled = !selected.size;
  // The Kindle may be unplugged when viewing earlier screenshots: delete only in the live gallery.
  $("del").hidden = !live;
  $("del").disabled = !selected.size || !live;
  $("all").disabled = !shots.length;
  $("all").textContent = shots.length && selected.size === shots.length ? "Deselect all" : "Select all";
}

function toggle(i) {
  const name = shots[i].name;
  selected.has(name) ? selected.delete(name) : selected.add(name);
  grid.querySelector(`.card[data-i="${i}"] .pick`).setAttribute("aria-pressed", selected.has(name));
  update();
}

grid.onclick = e => {
  const c = e.target.closest(".card"); if (!c) return;
  if (e.target.closest(".peek")) openViewer(+c.dataset.i);
  else if (e.target.closest(".pick")) toggle(+c.dataset.i);
};

// ---- Preview: the arrows go through the screenshots.
const viewer = $("viewer");
function showViewer(i) {
  vi = (i + shots.length) % shots.length;
  const s = shots[vi], img = $("vimg"), src = shotUrl(s);
  if (img.getAttribute("src") !== src) {
    img.classList.add("loading");
    img.onload = () => img.classList.remove("loading");
    img.src = src;
  }
  $("vlabel").textContent = `${s.label} · ${vi + 1}/${shots.length}`;
  $("vprev").disabled = $("vnext").disabled = shots.length < 2;
  const on = selected.has(s.name);
  $("vpick").setAttribute("aria-pressed", on);
  $("vpick").textContent = on ? "Selected" : "Select";
}
function openViewer(i) {
  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden", "false");
  $("vclose").focus();
  showViewer(i);
}
function closeViewer() {
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
  const peek = grid.querySelector(`.card[data-i="${vi}"] .peek`);
  if (peek) peek.focus();
}
$("vprev").onclick = () => showViewer(vi - 1);
$("vnext").onclick = () => showViewer(vi + 1);
$("vpick").onclick = () => { toggle(vi); showViewer(vi); };
$("vclose").onclick = closeViewer;
viewer.onclick = e => { if (e.target === viewer) closeViewer(); };

// ---- Delete
const confirmBox = $("confirm");
function openConfirm() {
  $("ctitle").textContent = "Delete from Kindle?";
  $("ctext").textContent = `${plural(selected.size, "screenshot")} will be permanently deleted from the Kindle. This can't be undone.`;
  $("cyes").hidden = false; $("cyes").disabled = false;
  $("cno").textContent = "Cancel"; $("cno").disabled = false;
  confirmBox.classList.add("open");
  confirmBox.setAttribute("aria-hidden", "false");
  $("cno").focus();
}
function closeConfirm() {
  confirmBox.classList.remove("open");
  confirmBox.setAttribute("aria-hidden", "true");
  $("del").disabled ? $("close").focus() : $("del").focus();
}
function confirmMessage(title, text) {
  $("ctitle").textContent = title;
  $("ctext").textContent = text;
  $("cyes").hidden = true;
  $("cno").textContent = "OK"; $("cno").disabled = false;
  $("cno").focus();
}
$("del").onclick = openConfirm;
$("cno").onclick = closeConfirm;
confirmBox.onclick = e => { if (e.target === confirmBox && !$("cno").disabled) closeConfirm(); };
$("cyes").onclick = async () => {
  $("cyes").disabled = $("cno").disabled = true;
  $("ctext").textContent = "Deleting…";
  try {
    const d = await (await fetch("/api/delete", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names: [...selected] }),
    })).json();
    if (d.error) return confirmMessage("Couldn't delete", ERRORS[d.error] || "Something went wrong.");
    selected = new Set(d.failed);
    render(d.shots);
    if (d.failed.length) confirmMessage("Some weren't deleted", `The Kindle didn't delete ${plural(d.failed.length, "screenshot")}.`);
    else closeConfirm();
  } catch { confirmMessage("Couldn't delete", "Can't reach the server."); }
};

$("all").onclick = () => {
  const on = selected.size !== shots.length;
  selected = new Set(on ? shots.map(s => s.name) : []);
  grid.querySelectorAll(".pick").forEach(c => c.setAttribute("aria-pressed", on));
  update();
};

// One screenshot downloads as a PNG, several as a ZIP.
$("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = "/api/download?" + [...selected].map(n => "n=" + encodeURIComponent(n)).join("&");
  a.download = "";
  document.body.appendChild(a); a.click(); a.remove();
};

$("close").onclick = closeSheet;
sheet.onclick = e => { if (e.target === sheet) closeSheet(); };
document.addEventListener("keydown", e => {
  if (confirmBox.classList.contains("open")) {
    if (e.key === "Escape" && !$("cno").disabled) closeConfirm();
  } else if (viewer.classList.contains("open")) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") showViewer(vi - 1);
    else if (e.key === "ArrowRight") showViewer(vi + 1);
  } else if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
});
</script>
</body>
</html>
